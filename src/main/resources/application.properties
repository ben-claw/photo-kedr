spring.application.name=photo-kedr

# Local persistent H2 database. The schema is initialized from schema.sql.
spring.datasource.url=jdbc:h2:file:./data/photo-kedr;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always
