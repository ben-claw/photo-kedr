<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация — Photo Kedr</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <section class="card form-card">
        <a class="text-link back-link" th:href="@{/}">← На главную</a>
        <h1>Создать аккаунт</h1>

        <p class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></p>

        <form class="form" th:action="@{/register}" th:object="${registrationForm}" method="post">
            <label for="login">Имя пользователя</label>
            <input id="login" type="text" th:field="*{login}" minlength="3" maxlength="32" required autocomplete="username">

            <label for="password">Пароль (не менее 8 символов)</label>
            <input id="password" type="password" th:field="*{password}" minlength="8" required autocomplete="new-password">

            <label for="passwordConfirmation">Повторите пароль</label>
            <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" minlength="8" required autocomplete="new-password">

            <button class="button button-primary button-full" type="submit">Зарегистрироваться</button>
        </form>

        <p class="form-footer">Уже есть аккаунт? <a class="text-link" th:href="@{/login}">Войти</a></p>
    </section>
</main>
</body>
</html>
