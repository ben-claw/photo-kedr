<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${album.name} + ' — Photo Kedr'">Альбом — Photo Kedr</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell page-shell-top">
    <section class="card profile-card profile-card-wide">
        <a class="text-link back-link" th:href="@{/user}">← На мою страницу</a>
        <p class="eyebrow">Фотоальбом</p>
        <h1 th:text="${album.name}">Название альбома</h1>

        <section class="upload-section" aria-labelledby="upload-heading">
            <h2 id="upload-heading">Загрузить фотографию</h2>
            <p class="upload-help">Загрузите изображение JPEG, PNG или GIF (до 10 МБ). При загрузке дата берётся из даты изменения исходного файла.</p>
            <p class="notice notice-error" th:if="${error}" th:text="${error}" role="alert"></p>
            <form class="form upload-form" th:action="@{/albums/{id}/photos(id=${album.id})}" method="post" enctype="multipart/form-data">
                <label for="file">Файл изображения</label>
                <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/gif" required>
                <input id="lastModified" name="lastModified" type="hidden">
                <button class="button button-primary" type="submit">Загрузить</button>
            </form>
        </section>

        <section class="photos-section" aria-labelledby="photos-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Ваши снимки</p>
                    <h2 id="photos-heading">Фотографии</h2>
                </div>
                <span class="photo-count" th:text="${#lists.size(photos)} + ' фото'">0 фото</span>
            </div>
            <p class="empty-state" th:if="${#lists.isEmpty(photos)}">В альбоме пока нет фотографий.</p>
            <ul class="photo-grid" th:if="${!#lists.isEmpty(photos)}">
                <li class="photo-card" th:each="photo : ${photos}">
                    <a class="photo-card-link" th:href="@{/photos/{id}(id=${photo.id})}">
                        <img class="photo-thumbnail" th:src="@{/photos/{id}/image(id=${photo.id})}" th:alt="${photo.description}">
                        <span class="photo-card-details">
                            <strong th:text="${photo.description}">Описание фотографии</strong>
                            <time th:text="${#temporals.format(photo.photoDate, 'dd.MM.yyyy')}" th:datetime="${photo.photoDate}">01.01.2025</time>
                        </span>
                    </a>
                </li>
            </ul>
        </section>
    </section>
</main>
<script>
    document.getElementById('file').addEventListener('change', function () {
        const file = this.files && this.files[0];
        document.getElementById('lastModified').value = file ? file.lastModified : '';
    });
</script>
</body>
</html>
