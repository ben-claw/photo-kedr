<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Моя страница — Photo Kedr</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <section class="card profile-card">
        <p class="eyebrow">Личный кабинет</p>
        <h1>Привет, <span th:text="${user.login}">пользователь</span>!</h1>
        <p class="intro">Это ваша страница Photo Kedr. Скоро здесь появятся ваши альбомы и фотографии.</p>
        <p class="profile-meta">ID пользователя: <span th:text="${user.id}">1</span></p>
        <form th:action="@{/logout}" method="post">
            <button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </section>
</main>
</body>
</html>
