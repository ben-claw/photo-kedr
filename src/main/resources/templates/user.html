<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Моя страница — Photo Kedr</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell page-shell-top">
    <section class="card profile-card profile-card-wide">
        <p class="eyebrow">Личный кабинет</p>
        <h1>Привет, <span th:text="${user.login}">пользователь</span>!</h1>
        <p class="profile-meta">ID пользователя: <span th:text="${user.id}">1</span></p>

        <section class="albums-section" aria-labelledby="albums-heading">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Ваши коллекции</p>
                    <h2 id="albums-heading">Альбомы</h2>
                </div>
                <a class="button button-primary" th:href="@{/albums/new}">Добавить</a>
            </div>
            <p class="empty-state" th:if="${#lists.isEmpty(albums)}">Пока нет альбомов. Создайте первый!</p>
            <ul class="album-list" th:if="${!#lists.isEmpty(albums)}">
                <li class="album-card" th:each="album : ${albums}">
                    <a class="album-link" th:href="@{/albums/{id}(id=${album.id})}" th:text="${album.name}">Название альбома</a>
                    <span class="album-arrow" aria-hidden="true">→</span>
                </li>
            </ul>
        </section>

        <form class="logout-form" th:action="@{/logout}" method="post">
            <button class="button button-secondary" type="submit">Выйти</button>
        </form>
    </section>
</main>
</body>
</html>
